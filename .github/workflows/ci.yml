# Personal project by Thomas Schueler.
# Developed on personal time using personal equipment.
# Not related to any employment.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build, test, and create the installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and test
        run: dotnet test PsGuiBuilder.sln --configuration Release --verbosity normal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Publish the self-contained app and build the installer
        shell: pwsh
        run: ./installer/build.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Shellmason-Setup
          path: |
            artifacts/Shellmason-Setup-*.exe
            artifacts/Shellmason-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $pushed = $env:GITHUB_REF.Substring("refs/tags/".Length)
            if ($pushed -ne $tag) { throw "Tag $pushed does not match VERSION ($tag)." }
          }
          $setup = "artifacts/Shellmason-Setup-$version.exe"
          $sum = "$setup.sha256"
          $changelog = Get-Content CHANGELOG.md -Raw
          $lines = $changelog -split "\r?\n"
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##[ \t]+\[?v?(?<version>\d+(?:\.\d+)*)\]?(?:[ \t].*)?$' -and $Matches.version -eq $version) {
              $start = $i
              break
            }
          }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version. The release was not published." }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##[ \t]+\S') { $end = $i; break }
          }
          $section = (($lines[$start..($end - 1)] -join "`n").Trim())
          if ([string]::IsNullOrWhiteSpace($section)) { throw "CHANGELOG.md has no section for $version. The release was not published." }
          $ownership = "Shellmason. Personal project by Thomas Schueler. Developed on personal time using personal equipment. Not related to any employment."
          $notes = $section + "`n`n" + $ownership
          $notesFile = Join-Path $env:RUNNER_TEMP "shellmason-release-notes.md"
          [System.IO.File]::WriteAllText($notesFile, $notes)
          $exists = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          if ($exists) {
            gh release upload $tag $setup $sum --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Publishing the GitHub Release failed." }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file $notesFile
          } else {
            gh release create $tag $setup $sum --repo $env:GITHUB_REPOSITORY --title "Shellmason $tag" --notes-file $notesFile --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the GitHub Release failed." }
          # A normal published release, not a draft and not a prerelease. It is public when the repository is public.
          # The app checks this release with no token.
          $publish = '{"draft":false,"prerelease":false,"make_latest":"true"}'
          $publish | gh api --method PATCH -H "Accept: application/vnd.github+json" "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --input -
          if ($LASTEXITCODE -ne 0) { throw "Publishing the GitHub Release failed." }
          $view = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Publishing the GitHub Release failed." }
          if ($view.isDraft) { throw "Release $tag is a draft. Shellmason publishes a normal release." }
          if ($view.isPrerelease) { throw "Release $tag is a prerelease. Shellmason publishes a normal release." }
          $setupName = "Shellmason-Setup-$version.exe"
          $found = @($view.assets | Where-Object { $_.name -eq $setupName })
          if ($found.Count -lt 1) { throw "Release $tag is missing $setupName." }

  linux:
    name: Core tests on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test core library
        run: dotnet test tests/PsGuiBuilder.Tests/PsGuiBuilder.Tests.csproj --configuration Release --verbosity normal
