name: Feature request
description: Suggest a command, a behavior, or a change to Shellmason.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Shellmason is a personal project. A new favorite can also be a `command-tree.json` entry. Say if you already tried that.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you want
      description: What Shellmason should do.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or module
      description: Optional. A cmdlet or module name, if this request is about one.
      placeholder: "Get-Service"
    validations:
      required: false
